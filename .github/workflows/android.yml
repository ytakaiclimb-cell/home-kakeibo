name: Build Android APK (お絵かきノート)

on:
  push:
    paths:
      - 'drawing-note/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drawing-note-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drawing-note
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DrawingNote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrawingNote-apk
          path: drawing-note/DrawingNote.apk

      # スマホから直接ダウンロードできるよう、最新ビルドをリリースにも置く
      - name: Publish to release "drawing-note-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete drawing-note-latest --yes --cleanup-tag || true
          gh release create drawing-note-latest DrawingNote.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "お絵かきノート（最新ビルド）" \
            --notes "ブランチ ${GITHUB_REF_NAME} / コミット ${GITHUB_SHA::7} からの自動ビルドです。DrawingNote.apk をAndroid端末でダウンロードしてインストールしてください。"

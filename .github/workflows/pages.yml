name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/home-screen-budget-app-taoe0s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は一度に1つだけ。進行中のデプロイはキャンセルしない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages が未設定なら有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # リポジトリ直下がそのまま静的サイト
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
